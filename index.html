<script type="module">
/* =========================================================
   PottyMouthPocket — The Spectrum Tech Engine
   A swear jar with a difference: someone hears a swear and accuses,
   the accused accepts or disputes (the group votes), and at the end
   of the round the cleanest mouth collects the jar.
   The app never handles money: it only keeps score. Paying is done
   outside the app (a shared Revolut wallet, cash, or square up at the end).
   On thespectrumtechengine.com it uses Firebase; anywhere else it runs as a
   practice copy kept on this device, with pretend friends to try it out.
   ========================================================= */

/* ---------------- settings ---------------- */
const FIREBASE_CONFIG = { // the potty-mouth Firebase project (these are public settings, not secrets)
  apiKey: "AIzaSyAB8dp2UqxZKw9GisGKjeX443_xRqPeokM",
  authDomain: "potty-mouth-88ff2.firebaseapp.com",
  projectId: "potty-mouth-88ff2",
  storageBucket: "potty-mouth-88ff2.firebasestorage.app",
  messagingSenderId: "276304743690",
  appId: "1:276304743690:web:135d90b14f84efa93b7ef3",
};
const FB = 'https://www.gstatic.com/firebasejs/12.19.0/';
const LIVE_HOST = /(^|\.)github\.io$|^(www\.)?(the)?spectrumtechengine\.com$/i.test(location.hostname);
const APP_URL = 'https://thespectrumtechengine.com/potty-mouth/';
const DAY = 864e5;
const VOTE_WINDOW = 2 * DAY;              // a dispute is settled by the votes in after 48 hours
const DEFAULT_TIERS = [
  { id: 'mild', label: 'Mild slip', emoji: '🤭', amount: 0.5 },
  { id: 'major', label: 'Proper swear', emoji: '😤', amount: 1 },
  { id: 'filth', label: 'Absolute filth', emoji: '🤬', amount: 2 },
];
const STAKES = {
  money: { emoji: '💶', label: 'Money', blurb: 'Swears cost money. The cleanest mouth collects the jar.' },
  forfeit: { emoji: '🍕', label: 'A forfeit', blurb: 'The dirtiest mouth pays a forfeit, like buying the takeaway.' },
  bragging: { emoji: '🏆', label: 'Bragging rights', blurb: 'No money. Just glory for the cleanest mouth.' },
};
const JAR_WAYS = {
  wallet: { emoji: '🏦', label: 'Shared wallet', blurb: 'Pay each swear into a shared Revolut (or other) wallet.' },
  cash: { emoji: '🫙', label: 'A real jar', blurb: 'Pay in cash into a jar at home or work.' },
  settle: { emoji: '🤝', label: 'Settle at the end', blurb: 'Keep a tab and square up when the round ends.' },
};
const COLORS = ['#E8513A', '#2E9E7A', '#7B5CD6', '#E8913A', '#2F7FD1', '#C2477F', '#4E8C2E', '#B8732E'];

/* ---------------- small helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = (s, n) => String(s || '').replace(/\s+/g, ' ').trim().slice(0, n);
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const makeCode = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
const ste = (f, ...a) => { try { if (window.STE && window.STE[f]) window.STE[f](...a); } catch (e) {} };
const local = {
  get(k, d) { try { const v = localStorage.getItem('pmp-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pmp-' + k, JSON.stringify(v)); } catch (e) {} },
};
function money(n, cur) {
  try { return new Intl.NumberFormat('en-IE', { style: 'currency', currency: cur || 'EUR' }).format(n || 0); }
  catch (e) { return (cur || '€') + (n || 0).toFixed(2); }
}
function timeLeft(ms) {
  if (ms <= 0) return 'Round over';
  const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return d ? `${d}d ${h}h left` : h ? `${h}h ${m}m left` : `${m}m left`;
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return new Date(t).toLocaleDateString('en-IE', { day: 'numeric', month: 'short' });
}
function toast(msg, ms = 3500) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), ms);
}
function share(text, url) {
  ste('track', 'share');
  const full = url ? `${text} ${url}` : text;
  if (navigator.share) return navigator.share(url ? { text, url } : { text }).catch(() => {});
  const wa = 'https://wa.me/?text=' + encodeURIComponent(full);
  if (!window.open(wa, '_blank')) location.href = wa;
}

/* ---------------- backends: Firebase on the website, a practice copy anywhere else ---------------- */
// Practice copy: everything lives in this browser, with pretend friends who react a bit like real people.
function practiceBackend() {
  const KEY = 'pmp-practice';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { groups: {} }; } catch (e) { return { groups: {} }; } };
  let db = load();
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} subs.forEach(f => f()); };
  const uid = local.get('practice-uid', null) || (() => { const u = 'me-' + rid(); local.set('practice-uid', u); return u; })();
  const G = c => db.groups[c];
  const api = {
    mode: 'practice', uid,
    async start() { return uid; },
    async getGroup(c) { return G(c)?.doc || null; },
    async createGroup(c, doc, member) { db.groups[c] = { doc: { ...doc }, members: { [uid]: member }, claims: {} }; save(); },
    async joinGroup(c, member) { G(c).members[uid] = member; save(); },
    async updateGroup(c, patch) { Object.assign(G(c).doc, patch); save(); },
    async updateMember(c, u, patch) { Object.assign(G(c).members[u], patch); save(); },
    async removeMember(c, u) { delete G(c).members[u]; save(); },
    async addClaim(c, claim) { const id = rid(); G(c).claims[id] = { ...claim }; save(); return id; },
    async updateClaim(c, id, patch) { const cl = G(c).claims[id]; for (const [k, v] of Object.entries(patch)) { if (k.startsWith('votes.')) (cl.votes = cl.votes || {})[k.slice(6)] = v; else cl[k] = v; } save(); },
    watch(c, cb) {
      const f = () => { const g = G(c); if (g) cb({ doc: g.doc, members: g.members, claims: g.claims }); };
      subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
    },
    // pretend friends, so the game can be tried alone
    addFriends(c) {
      const names = ['Aoife', 'Dec', 'Niamh', 'Gav'];
      for (const n of names) { const u = 'bot-' + n.toLowerCase(); if (!G(c).members[u]) G(c).members[u] = { name: n, color: COLORS[(Object.keys(G(c).members).length) % COLORS.length], joinedAt: Date.now(), bot: true }; }
      save();
    },
    tickBots(c) {
      const g = G(c); if (!g) return;
      let changed = false;
      for (const [id, cl] of Object.entries(g.claims)) {
        const accused = g.members[cl.accused];
        if (cl.status === 'pending' && accused?.bot && Date.now() - cl.createdAt > 2500) {
          if (Math.random() < .65) { cl.status = 'accepted'; cl.respondedAt = Date.now(); if (g.doc.stake === 'money' && g.doc.jarWay !== 'settle' && Math.random() < .7) { cl.paid = true; cl.paidAt = Date.now() + 1500; } }
          else { cl.status = 'disputed'; cl.disputed = true; cl.respondedAt = Date.now(); cl.votes = {}; }
          changed = true;
        }
        if (cl.status === 'disputed') for (const [u, m] of Object.entries(g.members)) if (m.bot && u !== cl.accused && u !== cl.accuser && cl.votes?.[u] === undefined && Date.now() - cl.respondedAt > 3000) { (cl.votes = cl.votes || {})[u] = Math.random() < .6; changed = true; }
      }
      // now and then a pretend friend catches you swearing
      if (Date.now() < g.doc.round.end && Math.random() < .08 && Object.values(g.claims).filter(x => x.accused === uid && x.status === 'pending').length === 0) {
        const bots = Object.entries(g.members).filter(([, m]) => m.bot);
        if (bots.length) {
          const [bu] = bots[Math.floor(Math.random() * bots.length)], t = g.doc.tiers[Math.floor(Math.random() * g.doc.tiers.length)];
          g.claims[rid()] = { accuser: bu, accused: uid, tier: t.id, amount: t.amount, note: ['in the kitchen', 'on the phone to your mam', 'at the match', 'when the WiFi dropped'][Math.floor(Math.random() * 4)], status: 'pending', votes: {}, round: g.doc.round.no, createdAt: Date.now(), paid: false };
          changed = true;
        }
      }
      if (changed) save();
    },
    async forgetMe() { local.set('practice-uid', null); },
    resetPractice() { localStorage.removeItem(KEY); db = load(); save(); },
  };
  addEventListener('storage', e => { if (e.key === KEY) { db = load(); subs.forEach(f => f()); } });
  return api;
}

// The real thing: Firestore. groups/{code}, groups/{code}/members/{uid}, groups/{code}/claims/{id}
async function firebaseBackend() {
  const [appM, authM, fsM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
  const app = appM.initializeApp(FIREBASE_CONFIG, 'potty-mouth');
  const auth = authM.getAuth(app), db = fsM.getFirestore(app);
  await auth.authStateReady();
  if (!auth.currentUser) await authM.signInAnonymously(auth);
  const uid = auth.currentUser.uid, { doc, collection, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, deleteField } = fsM;
  const gref = c => doc(db, 'groups', c);
  return {
    mode: 'live', uid,
    async start() { return uid; },
    async getGroup(c) { const s = await getDoc(gref(c)); return s.exists() ? s.data() : null; },
    async createGroup(c, d, member) { await setDoc(gref(c), d); await setDoc(doc(db, 'groups', c, 'members', uid), member); },
    async joinGroup(c, member) { await setDoc(doc(db, 'groups', c, 'members', uid), member); },
    updateGroup: (c, patch) => updateDoc(gref(c), patch),
    updateMember: (c, u, patch) => updateDoc(doc(db, 'groups', c, 'members', u), patch),
    removeMember: (c, u) => deleteDoc(doc(db, 'groups', c, 'members', u)),
    async addClaim(c, claim) { const r = await addDoc(collection(db, 'groups', c, 'claims'), claim); return r.id; },
    updateClaim: (c, id, patch) => updateDoc(doc(db, 'groups', c, 'claims', id), patch),
    async forgetMe() { try { await auth.currentUser.delete(); } catch (e) { await authM.signOut(auth).catch(() => {}); } },
    watch(c, cb) {
      const st = { doc: null, members: {}, claims: {} }, got = new Set(), fire = (k) => { got.add(k); if (st.doc && got.size === 3) cb({ ...st }); }; // wait until all three have loaded once
      const offs = [
        onSnapshot(gref(c), s => { st.doc = s.data() || null; fire('doc'); }, e => console.warn(e)),
        onSnapshot(collection(db, 'groups', c, 'members'), q => { st.members = {}; q.forEach(d => st.members[d.id] = d.data()); fire('members'); }, e => console.warn(e)),
        onSnapshot(collection(db, 'groups', c, 'claims'), q => { st.claims = {}; q.forEach(d => st.claims[d.id] = d.data()); fire('claims'); }, e => console.warn(e)),
      ];
      return () => offs.forEach(f => f());
    },
  };
}

/* ---------------- the rules of the game ---------------- */
const counts = cl => cl.status === 'accepted' || cl.status === 'upheld';
const tierOf = (g, id) => g.doc.tiers.find(t => t.id === id) || { label: 'Swear', emoji: '🤬', amount: 0 };
const isMoney = g => g.doc.stake === 'money';
const roundClaims = g => Object.entries(g.claims).filter(([, c]) => c.round === g.doc.round.no);
// who gets to vote on a dispute: everyone except the accused and the accuser
const voters = (g, cl) => Object.keys(g.members).filter(u => u !== cl.accused && u !== cl.accuser);
// work out a dispute: a majority of possible voters decides it; after 48 hours, the votes cast decide (a tie throws it out)
function verdict(g, cl) {
  if (cl.status !== 'disputed') return null;
  const vs = voters(g, cl); if (!vs.length) return null; // two-person group: the accuser stands by it or withdraws
  const yes = vs.filter(u => cl.votes?.[u] === true).length, no = vs.filter(u => cl.votes?.[u] === false).length, need = Math.floor(vs.length / 2) + 1;
  if (yes >= need) return 'upheld';
  if (no >= vs.length - need + 1) return 'dropped';
  if (Date.now() - (cl.respondedAt || cl.createdAt) > VOTE_WINDOW) return yes > no ? 'upheld' : 'dropped';
  return null;
}
function standings(g) {
  const s = {};
  for (const [u, m] of Object.entries(g.members)) s[u] = { uid: u, name: m.name, color: m.color, swears: 0, owed: 0, paid: 0, joinedAt: m.joinedAt || 0 };
  for (const [, c] of roundClaims(g)) if (counts(c) && s[c.accused]) { s[c.accused].swears++; s[c.accused].owed += c.amount || 0; if (c.paid) s[c.accused].paid += c.amount || 0; }
  const list = Object.values(s).sort((a, b) => a.swears - b.swears || a.owed - b.owed || a.joinedAt - b.joinedAt);
  const jar = list.reduce((t, p) => t + (g.doc.jarWay === 'settle' ? p.owed : p.paid), 0);
  const swears = list.reduce((t, p) => t + p.swears, 0);
  const best = list.length ? list[0].swears : 0;
  const winners = list.filter(p => p.swears === best && p.owed === list[0].owed);
  return { list, jar, swears, winners, dirtiest: list.length > 1 ? list[list.length - 1] : null };
}

function jarSVG(fill) {

  return `<svg viewBox="0 0 100 120" aria-hidden="true"><defs><clipPath id="jc"><path d="M22 34h56v66a14 14 0 0 1-14 14H36a14 14 0 0 1-14-14z"/></clipPath></defs>
    <rect x="26" y="12" width="48" height="16" rx="5" fill="var(--gold)"/>
    <path d="M22 34h56v66a14 14 0 0 1-14 14H36a14 14 0 0 1-14-14z" fill="var(--jar)" stroke="var(--ink)" stroke-width="3" opacity=".9"/>
    <g clip-path="url(#jc)"><rect x="20" y="${114 - h}" width="60" height="${h + 2}" fill="var(--gold)"/>
    ${h > 8 ? Array.from({ length: Math.min(9, Math.round(h / 8)) }, (_, i) => `<ellipse cx="${32 + (i * 17) % 38}" cy="${112 - (i * 7.5) % Math.max(8, h - 4)}" rx="8" ry="3.2" fill="#E59A12" opacity=".9"/>`).join('') : ''}</g>
    <path d="M22 34h56" stroke="var(--ink)" stroke-width="3"/><text x="50" y="70" text-anchor="middle" font-size="16" font-family="Fredoka" fill="var(--ink)" opacity=".55">#@%!</text></svg>`;
}

function groupHTML() {
  const g = S.g, tab = S.view.tab || 'jar';

function jarTab(g, mine, toVote, toStand) {
  const st = standings(g), over = Date.now() >= g.doc.round.end, cur = g.doc.currency;
  const leader = st.winners.map(w => w.uid === S.uid ? 'You' : w.name).join(' & ');
  const me = st.list.find(p => p.uid === S.uid);
  const unpaid = Object.entries(g.claims).filter(([, c]) => c.accused === S.uid && counts(c) && !c.paid && c.round === g.doc.round.no);
  let html = '';
  if (over) {
    const w = st.winners.map(p => p.uid === S.uid ? 'You' : p.name).join(' & ');
    html += `<div class="card center"><p class="big-emoji">🏆</p><h2>Round ${g.doc.round.no} is over!</h2>
      <p><b>${esc(w)}</b> ${st.winners.length > 1 ? 'share' : 'collects'} ${isMoney(g) ? 'the jar: <b>' + money(st.jar, cur) + '</b>' : g.doc.stake === 'bragging' ? 'the bragging rights' : 'the win'}.</p>
      ${g.doc.stake === 'forfeit' && st.dirtiest ? `<p>🍕 <b>${esc(st.dirtiest.uid === S.uid ? 'You' : st.dirtiest.name)}</b> ${st.dirtiest.uid === S.uid ? 'owe' : 'owes'} the forfeit${g.doc.forfeit ? ': ' + esc(g.doc.forfeit) : ''}.</p>` : ''}

  }
  if (mine.length) html += `<div class="card" style="border-color:var(--accent)"><h3>⚠️ You've been accused</h3>${mine.map(([id, c]) => claimLine(g, id, c, { buttons: `<div class="row" style="margin-top:8px"><button class="btn small mint" data-a="accept" data-id="${id}">Fair cop, I accept</button><button class="btn small ghost" data-a="dispute" data-id="${id}">Dispute it</button></div>` })).join('')}</div>`;
  if (toVote.length) html += `<div class="card" style="border-color:var(--gold)"><h3>🗳️ Your vote, please</h3><p class="muted tiny">They say they didn't swear. Did they?</p>${toVote.map(([id, c]) => claimLine(g, id, c, { buttons: `<div class="row" style="margin-top:8px"><button class="btn small primary" data-a="vote" data-v="1" data-id="${id}">They swore</button><button class="btn small ghost" data-a="vote" data-v="0" data-id="${id}">Throw it out</button></div>` })).join('')}</div>`;
  if (toStand.length) html += `<div class="card" style="border-color:var(--gold)"><h3>🤔 They're disputing it</h3><p class="muted tiny">There's nobody else to vote. Do you stand by it?</p>${toStand.map(([id, c]) => claimLine(g, id, c, { buttons: `<div class="row" style="margin-top:8px"><button class="btn small primary" data-a="stand" data-id="${id}">I stand by it</button><button class="btn small ghost" data-a="withdraw" data-id="${id}">Withdraw it</button></div>` })).join('')}</div>`;
  const raw = isMoney(g) ? 1 - Math.exp(-st.jar / 8) : 1 - Math.exp(-st.swears / 8), fill = raw ? Math.max(.18, raw) : 0;
  html += `<div class="card"><div class="jar-box">${jarSVG(fill)}<div class="grow">
      <div class="muted tiny">${isMoney(g) ? (g.doc.jarWay === 'settle' ? 'Owed to the jar' : 'In the jar') : 'Swears this round'}</div>
      <div class="jar-total">${isMoney(g) ? money(st.jar, cur) : st.swears}</div>
      <div class="countdown" data-countdown>${over ? 'Round over' : timeLeft(g.doc.round.end - Date.now())}</div>

  if (isMoney(g) && unpaid.length && g.doc.jarWay !== 'settle') {
    const total = unpaid.reduce((t, [, c]) => t + c.amount, 0);
    html += `<div class="card"><h3>💸 You owe the jar ${money(total, cur)}</h3>
      <p class="muted tiny">${g.doc.jarWay === 'cash' ? 'Pop it in the jar, then mark it paid.' : 'Pay it into the shared wallet, then mark it paid.'}</p>
      <div class="row wrap-row">${g.doc.jarWay === 'wallet' ? `<button class="btn small primary" data-a="pay" data-amt="${total}">Pay ${money(total, cur)}</button>` : ''}<button class="btn small mint" data-a="paid-all">I've paid it</button></div></div>`;
  }
  if (me && !over) html += `<p class="muted tiny center">You: ${me.swears} swear${me.swears === 1 ? '' : 's'} this round${isMoney(g) ? ' · ' + money(me.owed, cur) : ''}</p>`;
  if (Object.keys(g.members).length < 2) html += `<div class="card center"><p class="big-emoji">👀</p><p><b>It's just you so far.</b> Invite the people you live or work with.</p><button class="btn primary" data-a="invite">Invite people</button></div>`;
  return html;
}

function settleUpHTML(g, st) {

function ledgerTab(g) {
  // every claim tells its story: accused → accepted / disputed → votes → decided → paid
  const events = [];
  for (const [id, c] of Object.entries(g.claims)) {
    const A = member(c.accuser).name, D = member(c.accused).name, t = tierOf(g, c.tier);
    events.push({ t: c.createdAt, html: `🤬 <b>${esc(A)}</b> accused <b>${esc(D)}</b>: ${esc(t.label.toLowerCase())}${isMoney(g) ? ' (' + money(c.amount, g.doc.currency) + ')' : ''}${c.note ? ' · “' + esc(c.note) + '”' : ''}`, round: c.round });
    if (c.respondedAt) events.push({ t: c.respondedAt, html: !c.disputed ? `✅ <b>${esc(D)}</b> accepted it` : `🙅 <b>${esc(D)}</b> disputed it`, round: c.round });
    if (c.decidedAt) events.push({ t: c.decidedAt, html: c.status === 'upheld' ? `⚖️ It stands${c.stood ? ` (${esc(A)} stood by it)` : ' (the group voted)'}` : `🗑️ Thrown out${c.withdrawn ? ` (${esc(A)} withdrew it)` : ' (the group voted)'}`, round: c.round });
    if (c.paidAt) events.push({ t: c.paidAt, html: `💸 <b>${esc(D)}</b> marked ${money(c.amount, g.doc.currency)} as paid`, round: c.round });
  }
  events.sort((a, b) => b.t - a.t);
  const q = (S.view.q || '').toLowerCase();
  const shown = events.filter(e => !q || e.html.toLowerCase().includes(q)).slice(0, 200);
  return `<div class="card"><h3>📜 Everything that happened</h3>
    <input class="inp" data-input="q" placeholder="Search the ledger" value="${esc(S.view.q || '')}" aria-label="Search the ledger" style="margin:8px 0">

}

  <div class="card"><h3>🙋 You in this jar</h3>
    <form data-f="mine"><label class="field"><span>Your name here</span><input class="inp" name="name" maxlength="20" value="${esc(meM.name || '')}"></label>
    ${isMoney(g) ? `<label class="field"><span>Your payment link (optional)</span><input class="inp" name="payLink" maxlength="120" value="${esc(meM.payLink || '')}" placeholder="e.g. revolut.me/yourname"><span class="tiny muted" style="font-weight:600">Handy for settling up with you if you win.</span></label>` : ''}
    <button class="btn wide">Save</button></form></div>
  <div class="card"><h3>⚙️ The rules</h3>
    <p>${STAKES[g.doc.stake].emoji} ${esc(STAKES[g.doc.stake].label)}${g.doc.forfeit ? ': ' + esc(g.doc.forfeit) : ''}</p>
    ${isMoney(g) ? `<p>${g.doc.tiers.map(t => `${t.emoji} ${esc(t.label)} ${money(t.amount, g.doc.currency)}`).join(' · ')}</p><p>${JAR_WAYS[g.doc.jarWay].emoji} ${esc(JAR_WAYS[g.doc.jarWay].label)}${g.doc.jarInfo ? ': ' + esc(g.doc.jarInfo) : ''}</p>` : `<p>${g.doc.tiers.map(t => `${t.emoji} ${esc(t.label)}`).join(' · ')}</p>`}
    <p>Rounds last ${g.doc.round.days} days. This one ends ${new Date(g.doc.round.end).toLocaleString('en-IE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}.</p>
    <p class="tiny muted">Code: <b>${esc(S.view.code)}</b></p></div>
  <button class="btn ghost wide" data-a="leave">Leave this jar</button>`;
}

/* ---------------- sheets (pop-up panels) ---------------- */
function sheet(html) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-back" data-a="close-sheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = root.querySelector('input, button.btn'); if (first) setTimeout(() => first.focus(), 60);
}
const closeSheet = () => { $('#sheet-root').innerHTML = ''; };

function accuseSheet() {
  const g = S.g, others = Object.entries(g.members).filter(([u]) => u !== S.uid);
  if (!others.length) return toast('Invite someone first. You can\'t accuse yourself!');
  S.accuse = { who: others.length === 1 ? others[0][0] : null, tier: g.doc.tiers[1]?.id || g.doc.tiers[0].id };
  const draw = () => sheet(`<h2>🤬 Who swore?</h2>
    <div class="chips" style="margin:10px 0">${others.map(([u, m]) => `<button class="chip" data-a="pick-who" data-uid="${u}" aria-pressed="${S.accuse.who === u}">${esc(m.name)}</button>`).join('')}</div>
    <h3>How bad was it?</h3>
    <div class="chips" style="margin:10px 0">${g.doc.tiers.map(t => `<button class="chip" data-a="pick-tier" data-v="${t.id}" aria-pressed="${S.accuse.tier === t.id}">${t.emoji} ${esc(t.label)}${isMoney(g) ? ' · ' + money(t.amount, g.doc.currency) : ''}</button>`).join('')}</div>
    <label class="field"><span>Where or when? (optional)</span><input class="inp" id="acc-note" maxlength="60" placeholder="e.g. in the kitchen, on the call" value="${esc(S.accuse.note || '')}"></label>
    <div class="stack"><button class="btn primary wide" data-a="send-accuse" ${S.accuse.who ? '' : 'disabled'}>Accuse${S.accuse.who ? ' ' + esc(member(S.accuse.who).name) : ''}</button>
    <button class="btn ghost wide" data-a="close-sheet">Cancel</button></div>`);
  S.accuse.draw = draw; draw();
}

function inviteSheet() {
  const link = APP_URL + '?join=' + S.view.code;
  sheet(`<h2>➕ Invite people</h2>
    <p>Share the link, or tell them the code: <b style="font-size:1.4rem;letter-spacing:3px">${esc(S.view.code)}</b></p>
    <div class="stack"><button class="btn primary wide" data-a="share-invite">Send the invite</button>
    <button class="btn ghost wide" data-a="copy-invite">Copy the link</button>
    <button class="btn ghost wide" data-a="close-sheet">Done</button></div>`);
  S.inviteLink = link;
}

/* ---------------- actions ---------------- */
async function openGroup(code) {
  if (S.unwatch) S.unwatch();
  S.view = { page: 'group', code, tab: 'jar' }; S.g = null; render();
  S.unwatch = B().watch(code, g => {
    if (!g.doc) return;
    S.g = g;
    if (!g.members[S.uid]) { // removed from the group, or this phone left
      toast('You\'re not in this jar any more.'); S.groups = S.groups.filter(c => c !== code); saveGroups(); goHome(); return;
    }
    settleDisputes(code, g);
    if (S.view.page === 'group' && !$('#sheet-root').innerHTML) render();
    else if (S.view.page === 'group') { /* keep the open sheet; refresh underneath on close */ }
  });
}
// whoever is looking settles any dispute whose outcome is clear
function settleDisputes(code, g) {
  for (const [id, c] of Object.entries(g.claims)) {
    const v = verdict(g, c);
    if (v && !c.decidedAt) B().updateClaim(code, id, { status: v, decidedAt: Date.now() }).catch(() => {});
  }
}
function goHome() { if (S.unwatch) S.unwatch(); S.unwatch = null; S.g = null; S.view = { page: 'home' }; render(); fillGroupNames(); }
async function fillGroupNames() {
  for (const c of S.groups) { try { const d = await B().getGroup(c); const el = document.querySelector(`[data-name="${c}"]`); if (el && d) el.textContent = d.name; } catch (e) {} }
}
async function joinByCode(raw) {
  const code = clean(raw, 8).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 6) return toast('Codes are 6 letters and numbers.');
  if (S.groups.includes(code)) return openGroup(code);
  try {
    const d = await B().getGroup(code);
    if (!d) return toast('No jar with that code. Check it and try again.');
    await B().joinGroup(code, { name: S.me.name, color: COLORS[Math.floor(Math.random() * COLORS.length)], joinedAt: Date.now() });
    S.groups.push(code); saveGroups(); ste('detail', 'jar-joined'); closeSheet(); toast(`You're in ${d.name}! Mind your language.`); openGroup(code);
  } catch (e) { console.warn(e); toast('Couldn\'t join. Check your internet and try again.'); }
}
function newDraft() { return { name: '', stake: 'money', forfeit: '', currency: 'EUR', tiers: DEFAULT_TIERS.map(t => ({ ...t })), jarWay: 'wallet', jarInfo: '', days: 7 }; }
function readDraftForm() {
  const f = document.querySelector('form[data-f="create"]'); if (!f) return;
  const d = S.view.draft;
  d.name = f.gname?.value ?? d.name; if (f.forfeit) d.forfeit = f.forfeit.value; if (f.jarInfo) d.jarInfo = f.jarInfo.value;
  d.tiers.forEach((t, i) => { const el = f['amt' + i]; if (el) { const n = parseFloat(String(el.value).replace(',', '.')); if (isFinite(n) && n >= 0) t.amount = Math.round(n * 100) / 100; } });
}
async function createGroup() {
  readDraftForm();
  const d = S.view.draft, name = clean(d.name, 30);
  if (!name) return toast('Give your jar a name first.');
  let code = makeCode();
  for (let i = 0; i < 4 && await B().getGroup(code); i++) code = makeCode();
  const now = Date.now();
  const doc = {
    name, stake: d.stake, forfeit: d.stake === 'forfeit' ? clean(d.forfeit, 60) : '', currency: d.currency,
    tiers: d.tiers.map(t => ({ ...t, amount: d.stake === 'money' ? t.amount : 0 })), jarWay: d.stake === 'money' ? d.jarWay : 'none', jarInfo: d.stake === 'money' ? clean(d.jarInfo, 160) : '',
    round: { no: 1, start: now, end: now + d.days * DAY, days: d.days }, createdBy: S.uid, createdAt: now, history: [],
  };
  try {
    await B().createGroup(code, doc, { name: S.me.name, color: COLORS[0], joinedAt: now });
    S.groups.push(code); saveGroups(); ste('track', 'play'); ste('detail', 'jar-started-' + d.stake);
    openGroup(code); setTimeout(inviteSheet, 400);
  } catch (e) { console.warn(e); toast('Couldn\'t start the jar. Check your internet and try again.'); }
}

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault();
  if (f.dataset.f === 'me') {
    const name = clean(f.name.value, 20); if (!name) return;
    S.me = { name }; local.set('me', S.me); render(); fillGroupNames(); handleLink();
  }
  if (f.dataset.f === 'create') createGroup();
  if (f.dataset.f === 'mine') {
    const patch = { name: clean(f.name.value, 20) || S.me.name }; if (f.payLink) patch.payLink = clean(f.payLink.value, 120);
    await B().updateMember(S.view.code, S.uid, patch).catch(() => {}); toast('Saved.');
  }
  if (f.dataset.f === 'join') joinByCode(f.code.value);
});

document.addEventListener('input', e => {
  if (e.target.dataset.input === 'q') { S.view.q = e.target.value; const pos = e.target.selectionStart; render(); const i = document.querySelector('[data-input="q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, g = S.g, code = S.view.code;
  if (a === 'close-sheet') { if (e.target === el || el.tagName === 'BUTTON') { closeSheet(); if (S.view.page === 'group') render(); } return; }
  if (a === 'go-create') { S.view = { page: 'create', draft: newDraft() }; return render(); }
  if (a === 'back' || a === 'home') return goHome();
  if (a === 'open') return openGroup(el.dataset.code);
  if (a === 'forget') {
    e.preventDefault();
    if (!confirm('Delete your details? You will leave every jar on this phone, your name is removed from them, and this phone forgets you. Swears already in the ledger stay, but show as "Someone".')) return;
    for (const c of S.groups) await B().removeMember(c, S.uid).catch(() => {});
    await B().forgetMe?.().catch(() => {});
    ste('detail', 'deleted-details');
    for (const k of ['me', 'groups']) try { localStorage.removeItem('pmp-' + k); } catch (err) {}
    S.me = null; S.groups = []; render(); toast('Your details have been deleted.');
    setTimeout(() => location.reload(), 1500); return;
  }
  if (a === 'rename') { S.me = null; local.set('me', null); return render(); }
  if (a === 'join') return sheet(`<h2>Join a jar</h2><form data-f="join"><label class="field"><span>The 6-letter code</span><input class="inp" name="code" maxlength="8" autocapitalize="characters" style="letter-spacing:4px;text-transform:uppercase;font-size:1.3rem" placeholder="K7MP2R" required></label><button class="btn primary wide">Join</button></form><button class="btn ghost wide" data-a="close-sheet" style="margin-top:10px">Cancel</button>`);
  if (['stake', 'jarway', 'cur', 'days'].includes(a)) {
    readDraftForm(); const d = S.view.draft;
    if (a === 'stake') d.stake = el.dataset.v; if (a === 'jarway') d.jarWay = el.dataset.v; if (a === 'cur') d.currency = el.dataset.v; if (a === 'days') d.days = +el.dataset.v;
    return render();
  }
  if (!g) return;
  if (a === 'tab') { S.view.tab = el.dataset.v; render(); scrollTo(0, 0); return; }
  if (a === 'invite') return inviteSheet();
  if (a === 'share-invite') return share(`🤬🫙 Join our swear jar "${g.doc.name}" on PottyMouthPocket. Mind your language! Code ${code}:`, S.inviteLink);
  if (a === 'copy-invite') { try { await navigator.clipboard.writeText(S.inviteLink); toast('Link copied.'); } catch (err) { toast(S.inviteLink, 8000); } return; }
  if (a === 'friends') { if (B().addFriends) { B().addFriends(code); toast('Aoife, Dec, Niamh and Gav have joined. Watch your mouth!'); } return; }
  if (a === 'accuse') return accuseSheet();
  if (a === 'pick-who') { S.accuse.note = $('#acc-note')?.value || ''; S.accuse.who = el.dataset.uid; return S.accuse.draw(); }
  if (a === 'pick-tier') { S.accuse.note = $('#acc-note')?.value || ''; S.accuse.tier = el.dataset.v; return S.accuse.draw(); }
  if (a === 'send-accuse') {
    const t = tierOf(g, S.accuse.tier), who = S.accuse.who, note = clean($('#acc-note')?.value, 60);
    el.disabled = true;
    try {
      const id = await B().addClaim(code, { accuser: S.uid, accused: who, tier: t.id, amount: t.amount || 0, note, status: 'pending', votes: {}, round: g.doc.round.no, createdAt: Date.now(), paid: false });
      ste('detail', 'accusation-' + t.id); closeSheet(); render();
      sheet(`<p class="big-emoji center">📣</p><h2 class="center">${esc(member(who).name)} has been accused!</h2><p class="center muted">They'll see it next time they open the app. Want to give them a nudge?</p>
        <div class="stack"><button class="btn primary wide" data-a="nudge" data-id="${id}">Nudge them on WhatsApp</button><button class="btn ghost wide" data-a="close-sheet">Done</button></div>`);
    } catch (err) { console.warn(err); toast('Couldn\'t send that. Check your internet.'); el.disabled = false; }
    return;
  }
  if (a === 'nudge') {
    const c = g.claims[el.dataset.id] || {}, t = tierOf(g, c.tier);
    return share(`🤬 ${S.me.name} says you swore (${t.label.toLowerCase()})${c.note ? ' ' + c.note : ''}! Accept or dispute it in "${g.doc.name}":`, APP_URL + '?g=' + code);
  }
  const id = el.dataset.id, c = id && g.claims[id];
  if (a === 'accept' && c) { await B().updateClaim(code, id, { status: 'accepted', respondedAt: Date.now() }); ste('detail', 'accepted'); toast('Fair play for owning it.'); return; }
  if (a === 'dispute' && c) {
    await B().updateClaim(code, id, { status: 'disputed', respondedAt: Date.now(), disputed: true, votes: {} }); ste('detail', 'disputed');
    toast(voters(g, c).length ? 'Disputed. The rest of the group will vote.' : `Disputed. ${member(c.accuser).name} can stand by it or withdraw it.`); return;
  }
  if (a === 'vote' && c) { await B().updateClaim(code, id, { ['votes.' + S.uid]: el.dataset.v === '1' }); ste('detail', 'voted'); toast('Vote counted.'); return; }
  if (a === 'stand' && c) { await B().updateClaim(code, id, { status: 'upheld', decidedAt: Date.now(), stood: true }); toast('It stands. Marked as disputed in the ledger.'); return; }
  if (a === 'withdraw' && c) { await B().updateClaim(code, id, { status: 'dropped', decidedAt: Date.now(), withdrawn: true }); toast('Withdrawn.'); return; }
  if (a === 'pay') {
    const amt = money(+el.dataset.amt, g.doc.currency);
    try { await navigator.clipboard.writeText((+el.dataset.amt).toFixed(2)); } catch (err) {}
    const info = g.doc.jarInfo || '';
    const url = /^(https?:\/\/|revolut\.me|www\.)/i.test(info) ? (/^https?:/i.test(info) ? info : 'https://' + info) : null;
    ste('detail', 'pay-opened');
    if (url) { toast(`Amount copied: ${amt}. Paste it in when you pay.`); window.open(url, '_blank'); }
    else sheet(`<h2>💸 Pay ${amt}</h2><p>${info ? esc(info) : 'Pay it into your group\'s shared wallet.'}</p><p class="muted tiny">The amount is copied, so you can paste it.</p><button class="btn ghost wide" data-a="close-sheet">OK</button>`);
    return;
  }
  if (a === 'paid-all') {
    const mine = Object.entries(g.claims).filter(([, x]) => x.accused === S.uid && counts(x) && !x.paid && x.round === g.doc.round.no);
    for (const [cid] of mine) await B().updateClaim(code, cid, { paid: true, paidAt: Date.now() });
    ste('detail', 'paid'); toast('Marked as paid. Thanks for keeping the jar honest!'); return;
  }
  if (a === 'remove') { await B().removeMember(code, el.dataset.uid); return toast('Removed.'); }
  if (a === 'leave') {
    if (!confirm(`Leave "${g.doc.name}"? Your swears stay in the ledger.`)) return;
    await B().removeMember(code, S.uid).catch(() => {}); S.groups = S.groups.filter(x => x !== code); saveGroups(); return goHome();
  }
  if (a === 'new-round') {
    const st = standings(g), now = Date.now(), days = g.doc.round.days;
    const h = { no: g.doc.round.no, winners: st.winners.map(w => w.name).join(' & '), dirtiest: st.dirtiest && st.dirtiest.swears > st.winners[0].swears ? st.dirtiest.name : '', swears: st.swears, jar: Math.round(st.jar * 100) / 100, end: g.doc.round.end };
    await B().updateGroup(code, { round: { no: g.doc.round.no + 1, start: now, end: now + days * DAY, days }, history: [...(g.doc.history || []), h].slice(-20) });
    ste('detail', 'round-finished'); ste('value', 'swears-per-round', st.swears);
    return toast(`Round ${g.doc.round.no + 1} has started. Clean slate!`);
  }
  if (a === 'share-result') return shareResult(g);
});

/* ---------------- end-of-round picture to share ---------------- */
async function shareResult(g) {
  const st = standings(g), W = 1080, H = 1080, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  await document.fonts?.ready;
  x.fillStyle = '#FFF4E2'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2B211C'; x.textAlign = 'center';
  x.font = '700 64px Fredoka, sans-serif'; x.fillText(g.doc.name, W / 2, 150);
  x.font = '600 40px Nunito, sans-serif'; x.fillStyle = '#7A6A60'; x.fillText(`Round ${g.doc.round.no} results`, W / 2, 215);
  x.font = '160px serif'; x.fillText('🏆', W / 2, 430);
  x.fillStyle = '#2B211C'; x.font = '700 72px Fredoka, sans-serif'; x.fillText(st.winners.map(w => w.name).join(' & '), W / 2, 560);
  x.font = '600 42px Nunito, sans-serif'; x.fillText(isMoney(g) ? `collects the jar: ${money(st.jar, g.doc.currency)}` : 'cleanest mouth of the round', W / 2, 630);
  if (st.dirtiest && st.dirtiest.swears > st.winners[0].swears) { x.fillStyle = '#E8513A'; x.font = '700 40px Nunito, sans-serif'; x.fillText(`Dirtiest mouth: ${st.dirtiest.name} (${st.dirtiest.swears} swears)`, W / 2, 740); }
  x.fillStyle = '#2B211C'; x.font = '600 34px Nunito, sans-serif'; x.fillText(`${st.swears} swears caught this round  #@%&!`, W / 2, 820);
  x.fillStyle = '#7A6A60'; x.font = '600 30px Nunito, sans-serif'; x.fillText('PottyMouthPocket · thespectrumtechengine.com/potty-mouth', W / 2, 1010);
  const text = `🏆 ${st.winners.map(w => w.name).join(' & ')} won round ${g.doc.round.no} of "${g.doc.name}" on PottyMouthPocket!`;
  ste('track', 'share');
  try {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const file = new File([blob], 'potty-mouth-result.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + ' ' + APP_URL }); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  share(text, APP_URL);
}

/* ---------------- links: ?join=CODE and ?g=CODE ---------------- */
function handleLink() {
  const q = new URLSearchParams(location.search), j = q.get('join'), gc = q.get('g');
  if (!S.me) return;
  history.replaceState(null, '', location.pathname);
  if (j) joinByCode(j);
  else if (gc && S.groups.includes(gc.toUpperCase())) openGroup(gc.toUpperCase());
}

/* ---------------- start ---------------- */
async function boot() {
  render();
  try { S.backend = (FIREBASE_CONFIG && (LIVE_HOST || local.get('force-live', false))) ? await firebaseBackend() : practiceBackend(); }
  catch (e) { console.warn('Live connection failed, using a practice copy', e); S.backend = practiceBackend(); toast('Couldn\'t connect. This is a practice copy for now.'); }
  S.uid = await B().start();
  render(); fillGroupNames(); handleLink();
  // keep countdowns ticking, and let pretend friends react in a practice copy
  setInterval(() => {
    if (S.view.page !== 'group' || !S.g) return;
    if (B().tickBots) B().tickBots(S.view.code);
    const cd = document.querySelector('[data-countdown]'); if (cd) cd.textContent = Date.now() >= S.g.doc.round.end ? 'Round over' : timeLeft(S.g.doc.round.end - Date.now());
    if (Date.now() >= S.g.doc.round.end && !document.querySelector('[data-a="new-round"]') && !$('#sheet-root').innerHTML) render();
  }, 1500);
}
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
